[package]
name = "service"
version = "0.1.0"
edition = "2021"

[dependencies]
sea-orm = { version = "1.1.0", features = [
    "sqlx-postgres",
    "runtime-tokio-native-tls",
    "macros",
    "uuid",
] }
uuid = { version = "1", features = ["v4", "serde"] }
argon2 = "0.5"
jwts = "0.5.1"
rand = "0.8"
dotenv = "0.15.0"
chrono = {version = "0.4", features = ["serde"] }


entity = { path = "../entity" }
schema = { path = "../schema" }
database = { path = "../database" }
